name: Validate Harness Public Subset

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false

      - name: Checkout trusted validator revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Select validator revision
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "VALIDATOR_DIR=$GITHUB_WORKSPACE/trusted" >> "$GITHUB_ENV"
          else
            echo "VALIDATOR_DIR=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"
          fi

      - name: Public-subset scan of the complete repository
        run: node "$VALIDATOR_DIR/scripts/validate-public-subset.mjs" --root "$GITHUB_WORKSPACE/source"

      - name: Enforce no private evidence in the public manifest
        run: node "$VALIDATOR_DIR/scripts/validate-public-subset.mjs" --root "$GITHUB_WORKSPACE/source" --check-manifest

      - name: Validator self-test (planted-fixture negative tests)
        run: node "$VALIDATOR_DIR/scripts/validate-public-subset.mjs" --self-test
