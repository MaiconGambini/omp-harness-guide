name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Public-subset validator
        run: node scripts/validate-public-subset.mjs

      - name: Enforce no private evidence in the public manifest
        run: node scripts/validate-public-subset.mjs --check-manifest

      - name: Validator self-test (planted-fixture negative tests)
        run: node scripts/validate-public-subset.mjs --self-test

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --ignore-scripts
        working-directory: website

      - name: Typecheck
        run: npm run typecheck
        working-directory: website

      - name: Build site
        run: npm run build
        working-directory: website

      - name: Scan generated build output
        run: node scripts/validate-public-subset.mjs --scan-build


      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
